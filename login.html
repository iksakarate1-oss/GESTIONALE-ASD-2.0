<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTIONALE 2.0 - LOGIN</title>
    <script src="https://cdn.tailwindcss.com?v=3.0"></script>
    <style>
        body { background: #0b1120; color: white; min-height: 100vh; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="p-6 w-full">
    <div class="max-w-md w-full glass p-8 rounded-[2.5rem] shadow-2xl text-center">
        <div class="w-auto h-20 px-4 mx-auto mb-6 bg-orange-500 rounded-3xl flex items-center justify-center font-black italic text-xl border-4 border-white/10">GEST2.0</div>
        <h1 class="text-3xl font-black italic tracking-tighter text-amber-400 mb-2">GESTIONALE 2.0</h1>
        <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">Inserisci il tuo codice di accesso</p>
        
        <form onsubmit="verificaAccesso(event)" class="space-y-4">
            <input type="text" id="codice-input" placeholder="Inserisci Codice Utente" required class="w-full bg-slate-900 p-4 rounded-xl border border-white/10 text-center text-white tracking-widest text-lg focus:border-amber-400 outline-none uppercase">
            <button type="submit" class="w-full bg-amber-500 text-black font-black py-4 rounded-xl hover:bg-amber-400 transition uppercase tracking-wider text-sm">Accedi al Sistema</button>
        </form>
        <p id="error-msg" class="text-red-400 text-xs mt-4 font-bold min-h-[16px]"></p>
    </div>

    <script>
        const DATABASE_UTENTI = {
            "MASTER-IKSA-2026": { nome: "Amministratore Master", ruolo: "master", attivo: true, scadenza: "2099-12-31" },
            "IKSA-PALERMO-1":   { nome: "Sede Palermo 1", ruolo: "standard", attivo: true, scadenza: "2026-09-16" },
            "IKSA-PALERMO-2":   { nome: "Sede Palermo 2", ruolo: "standard", attivo: false, scadenza: "2026-08-30" },
            "GIUSEPPE D'AMATO": { nome: "A.S.D. D'AMATO", ruolo: "standard", attivo: true, scadenza: "2026-09-30" }
        };

        function isLicenzaScaduta(dataScadenzaStr) {
            if (!dataScadenzaStr) return false;
            const oggi = new Date();
            oggi.setHours(0, 0, 0, 0);
            return oggi > new Date(dataScadenzaStr);
        }

        function verificaAccesso(event) {
            event.preventDefault();
            const codice = document.getElementById('codice-input').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-msg');
            const utenteInfo = DATABASE_UTENTI[codice];

            if (!utenteInfo || utenteInfo.attivo !== true) {
                errorMsg.innerText = "ACCESSO REVOCATO O CODICE NON VALIDO.";
                return;
            }

            if (isLicenzaScaduta(utenteInfo.scadenza)) {
                errorMsg.innerText = "LICENZA SCADUTA IL " + utenteInfo.scadenza;
                return;
            }

            // Salva sessione in entrambe le memorie locali
            localStorage.setItem('asd_utente_corrente', codice);
            localStorage.setItem('asd_sessione_v2', 'true');
            sessionStorage.setItem('asd_utente_corrente', codice);
            sessionStorage.setItem('asd_sessione_v2', 'true');
            
            // Reindirizza mantenendo l'utente attivo
            window.location.href = "index.html?user=" + encodeURIComponent(codice);
        }
    </script>
</body>
</html>
